# Weekly encrypted backup of the production database (ADR 0004).
#
# The dump is encrypted with age before it touches the artifact store, because this repository is
# public and its artifacts can be downloaded by anyone. Only the holder of the private age key can
# read it. Photos are not included: the Admin downloads them from the app.
#
# Restore: download the artifact, then
#   age -d -i alvaro2b-backup.agekey backup.tar.age | tar -x
# and load roles.sql, schema.sql and data.sql, in that order, with psql.
name: Backup

on:
  schedule:
    - cron: "23 3 * * 0" # Sundays at 03:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      AGE_RECIPIENT: ${{ secrets.AGE_RECIPIENT }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$AGE_RECIPIENT" ]; then
            echo "::error::SUPABASE_DB_URL and AGE_RECIPIENT secrets are required"
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      - name: Dump and encrypt
        run: |
          set -euo pipefail
          umask 077
          work="$(mktemp -d)"
          supabase db dump --db-url "$SUPABASE_DB_URL" --role-only -f "$work/roles.sql"
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "$work/schema.sql"
          supabase db dump --db-url "$SUPABASE_DB_URL" --data-only --use-copy -s public,auth,storage -f "$work/data.sql"
          mkdir -p out
          tar -C "$work" -cf - roles.sql schema.sql data.sql | age -r "$AGE_RECIPIENT" -o out/backup.tar.age
          rm -rf "$work"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: alvaro2b-backup-${{ github.run_number }}
          path: out/backup.tar.age
          retention-days: 90
          if-no-files-found: error
